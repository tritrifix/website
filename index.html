<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tristan — Services</title>
<link rel="stylesheet" href="style.css">
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }

  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }

  .tile:hover {
    border-color: var(--border-strong);
    background: var(--panel-hover);
  }

  .tile-icon {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .tile-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .tile-icon .fallback {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--accent-text);
  }

  .tile-name {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .empty-note {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-faint);
    padding: 20px 0;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <div class="identity">
      <div class="avatar">T<img src="images/avatar.png" alt="" onerror="this.remove()"></div>
      <div>
        <h1>Tristan FIXARY</h1>
        <div class="tagline">page personnelle</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="active">Services</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section>
    <h2 class="section-label">services</h2>
    <div class="grid" id="service-grid"></div>
  </section>

  <footer class="site-footer">
    <span>Copyright © 2026 Tristan FIXARY - Tous droits réservés</span>
    <a href="https://github.com/tritrifix" target="_blank" rel="noopener">github.com/tritrifix</a>
  </footer>

</div>

<script src="services.js"></script>
<script>
  const grid = document.getElementById('service-grid');

  if (!SERVICES || SERVICES.length === 0) {
    grid.outerHTML = '<p class="empty-note">Aucun service configuré pour le moment. Ajoute des entrées dans services.js.</p>';
  } else {
    SERVICES.forEach(function (service) {
      const tile = document.createElement('a');
      tile.className = 'tile';
      tile.href = service.url || '#';
      if (service.desc) tile.title = service.desc;
      if (service.url && service.url.startsWith('http')) {
        tile.target = '_blank';
        tile.rel = 'noopener';
      }

      const iconWrap = document.createElement('div');
      iconWrap.className = 'tile-icon';

      if (service.image) {
        const img = document.createElement('img');
        img.src = service.image;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function () {
          iconWrap.innerHTML = '<span class="fallback">' + service.name.charAt(0).toUpperCase() + '</span>';
        };
        iconWrap.appendChild(img);
      } else {
        iconWrap.innerHTML = '<span class="fallback">' + service.name.charAt(0).toUpperCase() + '</span>';
      }

      const name = document.createElement('div');
      name.className = 'tile-name';
      name.textContent = service.name;

      tile.appendChild(iconWrap);
      tile.appendChild(name);
      grid.appendChild(tile);
    });
  }
</script>
</body>
</html>
